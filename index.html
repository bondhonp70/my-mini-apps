<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07070d">
<title>Learning Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="lessons.js?v=1"></script>
<style>
  :root {
    --bg: #07070d;
    --glass: rgba(255,255,255,.06);
    --glass2: rgba(255,255,255,.11);
    --stroke: rgba(255,255,255,.1);
    --txt: #f4f4fb;
    --mut: rgba(244,244,251,.62);
    --a1: #7c5cff;
    --a2: #00d4ff;
    --a3: #ff4fd8;
    --grad: linear-gradient(135deg, var(--a1), var(--a2));
    --grad2: linear-gradient(135deg, var(--a3), var(--a1));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Inter", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh; overflow-x: hidden;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 48px);
  }
  .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .45; z-index: 0; pointer-events: none; }
  .orb.o1 { width: 280px; height: 280px; background: var(--a1); top: -90px; left: -90px; animation: float 14s ease-in-out infinite; }
  .orb.o2 { width: 240px; height: 240px; background: var(--a2); top: 38%; right: -110px; animation: float 17s ease-in-out infinite reverse; }
  .orb.o3 { width: 260px; height: 260px; background: var(--a3); bottom: -110px; left: 5%; opacity: .3; animation: float 20s ease-in-out infinite; }
  @keyframes float { 50% { transform: translate(30px, 40px) scale(1.1); } }
  #app, #lessonView { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; }
  .hidden { display: none !important; }

  /* Header */
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; animation: rise .6s both; }
  .avatar {
    width: 52px; height: 52px; border-radius: 18px; display: grid; place-items: center;
    font-size: 22px; font-weight: 800; background: var(--grad);
    box-shadow: 0 8px 30px rgba(124,92,255,.5), inset 0 1px 0 rgba(255,255,255,.35);
    flex: 0 0 auto;
  }
  .hello { font-size: 22px; font-weight: 800; letter-spacing: -.4px; margin: 0; }
  .tag { font-size: 13px; color: var(--mut); margin: 3px 0 0; }
  .pills { display: flex; gap: 8px; margin-bottom: 16px; animation: rise .6s .08s both; }
  .pill {
    flex: 1; padding: 12px 14px; border-radius: 18px; background: var(--glass);
    border: 1px solid var(--stroke); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .pill b { display: block; font-size: 20px; font-weight: 800; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pill span { font-size: 12px; color: var(--mut); }

  /* Search */
  .search { position: relative; margin-bottom: 14px; animation: rise .6s .14s both; }
  .search input {
    width: 100%; padding: 15px 44px 15px 46px; border-radius: 20px; border: 1px solid var(--stroke);
    background: var(--glass); color: var(--txt); font-size: 15px; outline: none;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); transition: .2s;
  }
  .search input::placeholder { color: var(--mut); }
  .search input:focus { border-color: var(--a1); box-shadow: 0 0 0 4px rgba(124,92,255,.22); }
  .search .ico { position: absolute; left: 17px; top: 50%; transform: translateY(-50%); font-size: 17px; opacity: .85; }
  .search .clr {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px;
    border-radius: 50%; background: var(--glass2); display: grid; place-items: center; font-size: 12px; cursor: pointer;
  }

  /* Chips */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; animation: rise .6s .2s both; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 9px 16px; border-radius: 99px; font-size: 13.5px; font-weight: 600;
    background: var(--glass); border: 1px solid var(--stroke); color: var(--mut); cursor: pointer; transition: .2s;
    white-space: nowrap;
  }
  .chip:active { transform: scale(.94); }
  .chip.on { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 6px 24px rgba(124,92,255,.5); }
  .chips.cats .chip { padding: 7px 13px; font-size: 12.5px; }
  .chips.cats .chip.on { background: var(--grad2); box-shadow: 0 6px 24px rgba(255,79,216,.38); }

  /* Section titles */
  .sec { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 2px 12px; }
  .sec h3 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
  .sec span { font-size: 12.5px; color: var(--mut); }

  /* Cards */
  .hscroll { display: flex; gap: 14px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .hscroll::-webkit-scrollbar { display: none; }
  .grid { display: grid; gap: 14px; }
  @media (min-width: 560px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card {
    position: relative; border-radius: 24px; overflow: hidden; cursor: pointer;
    background: var(--glass); border: 1px solid var(--stroke);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    transition: transform .18s, box-shadow .25s; animation: rise .55s both;
  }
  .card:active { transform: scale(.97); box-shadow: 0 10px 40px rgba(124,92,255,.3); }
  .card.mini { flex: 0 0 76%; max-width: 300px; scroll-snap-align: start; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .thumb {
    position: relative; aspect-ratio: 16 / 9; background-size: cover; background-position: center;
    display: grid; place-items: center; font-size: 46px;
  }
  .thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(7,7,13,.82), transparent 58%); }
  .badge {
    position: absolute; z-index: 2; font-size: 11.5px; font-weight: 700; padding: 5px 10px; border-radius: 99px;
    background: rgba(0,0,0,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.14);
  }
  .badge.tl { top: 10px; left: 10px; } .badge.tr { top: 10px; right: 10px; }
  .badge.br { bottom: 10px; right: 10px; }
  .badge.rank { background: var(--grad2); border: none; font-size: 13px; box-shadow: 0 4px 16px rgba(255,79,216,.45); }
  .badge.open { background: rgba(0,200,120,.4); }
  .cbody { padding: 13px 16px 16px; }
  .ctitle { font-size: 15.5px; font-weight: 700; line-height: 1.35; letter-spacing: -.1px; }
  .cmeta { display: flex; gap: 14px; margin-top: 8px; font-size: 12.5px; color: var(--mut); }

  .skel { height: 215px; border-radius: 24px; background: linear-gradient(100deg, var(--glass) 30%, var(--glass2) 50%, var(--glass) 70%); background-size: 200% 100%; animation: shim 1.3s infinite; }
  @keyframes shim { to { background-position: -200% 0; } }

  .empty { text-align: center; padding: 46px 10px; color: var(--mut); }
  .empty div { font-size: 46px; margin-bottom: 8px; }

  /* Lesson page */
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .iconbtn {
    width: 44px; height: 44px; border-radius: 15px; border: 1px solid var(--stroke); background: var(--glass);
    color: var(--txt); font-size: 19px; display: grid; place-items: center; cursor: pointer; flex: 0 0 auto;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .ltitle { font-size: 23px; font-weight: 800; letter-spacing: -.5px; line-height: 1.25; margin: 4px 2px 10px; animation: rise .5s both; }
  .metarow { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 2px 14px; }
  .meta { font-size: 12.5px; padding: 6px 12px; border-radius: 99px; background: var(--glass); border: 1px solid var(--stroke); color: var(--mut); }
  .meta.timer { background: rgba(0,200,120,.18); border-color: rgba(0,200,120,.4); color: #7dffc4; font-weight: 700; }
  .meta.timer.low { background: rgba(255,90,90,.18); border-color: rgba(255,90,90,.45); color: #ffb0b0; }
  .player { border-radius: 24px; overflow: hidden; border: 1px solid var(--stroke); box-shadow: 0 20px 70px rgba(124,92,255,.3); background: #000; animation: rise .5s both; }
  .player iframe, .player video { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; background: #000; }
  .desc { margin: 16px 2px 0; font-size: 14.5px; line-height: 1.65; color: var(--mut); }
  .lockbox { border-radius: 26px; overflow: hidden; border: 1px solid var(--stroke); background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); animation: rise .5s both; }
  .lockbox .thumb .big { position: relative; z-index: 2; font-size: 58px; filter: drop-shadow(0 6px 20px rgba(0,0,0,.65)); animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .lockin { padding: 20px 18px 22px; text-align: center; }
  .lockin h4 { margin: 0 0 6px; font-size: 19px; font-weight: 800; letter-spacing: -.3px; }
  .lockin p { margin: 0 0 14px; font-size: 13.5px; color: var(--mut); line-height: 1.55; }
  .dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
  .dot { width: 36px; height: 6px; border-radius: 9px; background: var(--glass2); transition: .3s; }
  .dot.on { background: var(--grad); box-shadow: 0 0 14px rgba(0,212,255,.65); }
  .btn {
    width: 100%; padding: 16px; border: none; border-radius: 19px; font-size: 16px; font-weight: 800; cursor: pointer;
    color: #fff; background: var(--grad); box-shadow: 0 10px 36px rgba(124,92,255,.55), inset 0 1px 0 rgba(255,255,255,.3); transition: .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .55; box-shadow: none; }
  .btn.ghost { background: var(--glass); border: 1px solid var(--stroke); box-shadow: none; color: var(--txt); font-weight: 700; }
  .btnrow { display: flex; gap: 10px; margin-top: 14px; }
  .btnrow .btn { padding: 14px; font-size: 15px; }
  .btn.liked { background: var(--grad2); border: none; box-shadow: 0 8px 30px rgba(255,79,216,.42); color: #fff; }
  .note { font-size: 12.5px; color: var(--mut); text-align: center; margin: 12px 0 0; }

  .next {
    display: flex; align-items: center; gap: 14px; margin-top: 18px; padding: 14px; border-radius: 22px; cursor: pointer;
    background: var(--glass); border: 1px solid var(--stroke); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .next:active { transform: scale(.98); }
  .next .nico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; background: var(--grad); flex: 0 0 auto; }
  .next small { display: block; font-size: 11.5px; color: var(--mut); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 2px; }
  .next b { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .next .arrow { margin-left: auto; font-size: 20px; opacity: .7; }

  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 28px); transform: translate(-50%, 30px);
    padding: 12px 18px; border-radius: 16px; font-size: 14px; font-weight: 600; z-index: 99; opacity: 0;
    background: rgba(30,30,48,.94); border: 1px solid var(--stroke); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: .3s; max-width: 90%; text-align: center; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<div id="app">
  <div class="head">
    <div class="avatar" id="avatar">L</div>
    <div>
      <h1 class="hello" id="hello">Welcome 👋</h1>
      <p class="tag">Learn something new today</p>
    </div>
  </div>

  <div class="pills">
    <div class="pill"><b id="stLessons">0</b><span>Lessons</span></div>
    <div class="pill"><b id="stViews">–</b><span>Total views</span></div>
    <div class="pill"><b id="stLikes">–</b><span>Total likes</span></div>
  </div>

  <div class="search">
    <span class="ico">🔍</span>
    <input id="search" type="text" placeholder="Search lessons, topics..." autocomplete="off">
    <span class="clr hidden" id="clr">✕</span>
  </div>

  <div class="chips" id="chips"></div>
  <div class="chips cats" id="cats"></div>

  <div id="featWrap" class="hidden">
    <div class="sec"><h3>🔥 Trending Now</h3><span>Top picks</span></div>
    <div class="hscroll" id="feat"></div>
  </div>

  <div class="sec"><h3 id="libTitle">All Lessons</h3><span id="libCount"></span></div>
  <div class="grid" id="lib"></div>
</div>

<div id="lessonView" class="hidden">
  <div class="topbar">
    <div class="iconbtn" id="backBtn">←</div>
  </div>
  <div id="lessonBody"></div>
</div>

<div id="toast"></div>

<script type="module">
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor("#07070d"); tg.setBackgroundColor("#07070d"); } catch (e) {}

  /* =====================================================
     SETTINGS (lessons are edited in lessons.js, not here)
     ===================================================== */
  const BLOCK_ID = "52829";
  const DEFAULT_ADS = 1;
  const UNLOCK_MINUTES = 3;   // 0 = ad every single time. 3 = stays unlocked for 3 minutes
  const APP_LINK = "https://t.me/Exclusive_Buzz_bot/Video";
  const AUTO_THUMBS = true;   // uses thumbs/<id>.jpg if the file exists

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyD0BpbpBmcf1v88Eo-CSpbdOEdHVHrrVE4",
    authDomain: "learning-hub-309f6.firebaseapp.com",
    projectId: "learning-hub-309f6",
    appId: "1:315700398621:web:e401fdfe3a0534d69494f4"
  };
  const FB_VER = "10.12.2";

  /* ---------------- clean lesson list ---------------- */
  const seen = new Set();
  const LESSONS = (Array.isArray(window.LESSONS) ? window.LESSONS : []).filter((l) => {
    if (!l || l.id === undefined || !l.title || !l.url) return false;
    if (/xxxx/i.test(l.url) || /YOUR_/i.test(l.url)) return false;
    if (seen.has(l.id)) { console.log("Duplicate lesson id skipped:", l.id); return false; }
    seen.add(l.id);
    return true;
  });

  /* ---------------- helpers ---------------- */
  const $ = (id) => document.getElementById(id);
  const GRADS = [
    "linear-gradient(135deg,#667eea,#764ba2)", "linear-gradient(135deg,#f093fb,#f5576c)",
    "linear-gradient(135deg,#4facfe,#00f2fe)", "linear-gradient(135deg,#43e97b,#38f9d7)",
    "linear-gradient(135deg,#fa709a,#fee140)", "linear-gradient(135deg,#a18cd1,#fbc2eb)",
    "linear-gradient(135deg,#ff9a9e,#fad0c4)", "linear-gradient(135deg,#30cfd0,#330867)"
  ];
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function fmt(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(".0", "") + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(".0", "") + "K";
    return String(n);
  }
  function mmss(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }
  function loadList(k) { try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch (e) { return []; } }
  function saveList(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function haptic(t) { try { tg.HapticFeedback.impactOccurred(t || "light"); } catch (e) {} }
  function hapticOk() { try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {} }
  let toastT;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove("show"), 2800);
  }

  let viewed = loadList("viewed");
  let liked = loadList("liked");

  // Unlock state lives in memory only (never saved), so a new visit needs a new ad
  const unlockedUntil = {};
  const isOpen = (id) => !!unlockedUntil[id] && unlockedUntil[id] > Date.now();

  /* ---------------- ads ---------------- */
  let AdController = null;
  try { AdController = window.Adsgram.init({ blockId: BLOCK_ID }); }
  catch (e) { console.log("Ad init failed", e); }

  /* ---------------- firebase ---------------- */
  let db = null, fs = null, stats = {}, loading = true;
  const statsOn = () => !!db;
  const getStat = (id, k) => (stats[id] && stats[id][k]) || 0;

  async function initFirebase() {
    if (!FIREBASE_CONFIG.projectId) return;
    try {
      const base = "https://www.gstatic.com/firebasejs/" + FB_VER + "/";
      const appMod = await import(base + "firebase-app.js");
      fs = await import(base + "firebase-firestore.js");
      const app = appMod.initializeApp(FIREBASE_CONFIG);
      db = fs.getFirestore(app);
      const snap = await Promise.race([
        fs.getDocs(fs.collection(db, "stats")),
        new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 8000))
      ]);
      snap.forEach((d) => { stats[d.id] = d.data(); });
    } catch (e) {
      console.log("Firebase failed", e);
      db = null;
    }
  }
  function bump(id, key) {
    if (!stats[id]) stats[id] = {};
    stats[id][key] = (stats[id][key] || 0) + 1;
    if (db) {
      fs.setDoc(fs.doc(db, "stats", String(id)), { [key]: fs.increment(1) }, { merge: true })
        .catch((e) => console.log(e));
    }
  }

  /* ---------------- state ---------------- */
  let mode = "all", cat = "all", query = "";
  const MODES = [
    { k: "all", t: "✨ All" },
    { k: "trending", t: "🔥 Trending", s: 1 },
    { k: "views", t: "👁 Most Viewed", s: 1 },
    { k: "likes", t: "❤️ Most Liked", s: 1 },
    { k: "new", t: "🆕 Newest" }
  ];
  const TITLES = {
    all: "All Lessons", trending: "Trending", views: "Most Viewed", likes: "Most Liked", new: "Newest"
  };

  const score = (l) => getStat(l.id, "views") + getStat(l.id, "likes") * 2;

  function getList() {
    let a = LESSONS.filter((l) => {
      if (cat !== "all" && l.category !== cat) return false;
      if (!query) return true;
      return (l.title + " " + (l.category || "") + " " + (l.desc || "")).toLowerCase().includes(query);
    });
    if (mode === "trending") a.sort((x, y) => score(y) - score(x) || y.id - x.id);
    else if (mode === "views") a.sort((x, y) => getStat(y.id, "views") - getStat(x.id, "views") || y.id - x.id);
    else if (mode === "likes") a.sort((x, y) => getStat(y.id, "likes") - getStat(x.id, "likes") || y.id - x.id);
    else if (mode === "new") a.sort((x, y) => y.id - x.id);
    return a;
  }

  /* ---------------- rendering ---------------- */
  function thumbSrc(l) {
    if (l.thumb) return l.thumb;
    if (AUTO_THUMBS) return "thumbs/" + l.id + ".jpg";
    return "";
  }

  // Gradient + emoji first. Swaps to the image only if it loads (no black boxes).
  function thumbEl(l) {
    const t = el("div", "thumb");
    t.style.backgroundImage = GRADS[Math.abs(l.id) % GRADS.length];
    const ic = el("span", "", l.icon || "🎓");
    ic.style.position = "relative";
    ic.style.zIndex = "1";
    t.appendChild(ic);

    const src = thumbSrc(l);
    if (src) {
      const img = new Image();
      img.onload = () => {
        t.style.backgroundImage = 'url("' + encodeURI(src) + '")';
        if (ic.parentNode) ic.parentNode.removeChild(ic);
      };
      img.onerror = () => {};
      img.src = src;
    }
    return t;
  }

  function makeCard(l, idx, rank, mini) {
    const card = el("div", mini ? "card mini" : "card");
    card.style.animationDelay = Math.min(idx, 10) * 45 + "ms";
    const th = thumbEl(l);
    if (rank) th.appendChild(el("span", "badge tl rank", "#" + rank));
    else if (l.category) th.appendChild(el("span", "badge tl", l.category));
    th.appendChild(el("span", "badge tr" + (isOpen(l.id) ? " open" : ""), isOpen(l.id) ? "✅ Unlocked" : "🔒 Locked"));
    if (l.duration) th.appendChild(el("span", "badge br", "⏱ " + l.duration));
    card.appendChild(th);

    const body = el("div", "cbody");
    body.appendChild(el("div", "ctitle", l.title));
    if (statsOn()) {
      const m = el("div", "cmeta");
      m.appendChild(el("span", "", "👁 " + fmt(getStat(l.id, "views"))));
      m.appendChild(el("span", "", "❤️ " + fmt(getStat(l.id, "likes"))));
      body.appendChild(m);
    }
    card.appendChild(body);
    card.addEventListener("click", () => { haptic(); openLesson(l); });
    return card;
  }

  function renderChips() {
    const c = $("chips");
    c.innerHTML = "";
    MODES.filter((m) => !m.s || statsOn()).forEach((m) => {
      const b = el("div", "chip" + (mode === m.k ? " on" : ""), m.t);
      b.addEventListener("click", () => { mode = m.k; haptic(); render(); });
      c.appendChild(b);
    });

    const cc = $("cats");
    cc.innerHTML = "";
    const cats = [...new Set(LESSONS.map((l) => l.category).filter(Boolean))];
    cc.classList.toggle("hidden", cats.length < 2);
    if (cats.length >= 2) {
      ["all", ...cats].forEach((k) => {
        const b = el("div", "chip" + (cat === k ? " on" : ""), k === "all" ? "All topics" : k);
        b.addEventListener("click", () => { cat = k; haptic(); render(); });
        cc.appendChild(b);
      });
    }
  }

  function renderStats() {
    $("stLessons").textContent = LESSONS.length;
    let v = 0, k = 0;
    LESSONS.forEach((l) => { v += getStat(l.id, "views"); k += getStat(l.id, "likes"); });
    $("stViews").textContent = statsOn() ? fmt(v) : "–";
    $("stLikes").textContent = statsOn() ? fmt(k) : "–";
  }

  function render() {
    renderChips();
    renderStats();
    $("clr").classList.toggle("hidden", !query);

    const lib = $("lib");
    lib.innerHTML = "";

    if (loading) {
      $("featWrap").classList.add("hidden");
      for (let i = 0; i < 4; i++) lib.appendChild(el("div", "skel"));
      $("libCount").textContent = "";
      return;
    }

    const showFeat = statsOn() && mode === "all" && cat === "all" && !query && LESSONS.length > 1;
    $("featWrap").classList.toggle("hidden", !showFeat);
    if (showFeat) {
      const f = $("feat");
      f.innerHTML = "";
      LESSONS.slice().sort((x, y) => score(y) - score(x) || y.id - x.id)
        .slice(0, 5).forEach((l, i) => f.appendChild(makeCard(l, i, i + 1, true)));
    }

    const list = getList();
    $("libTitle").textContent = query ? "Search Results" : TITLES[mode];
    $("libCount").textContent = list.length + (list.length === 1 ? " lesson" : " lessons");

    if (!list.length) {
      const e = el("div", "empty");
      e.appendChild(el("div", "", "🔎"));
      e.appendChild(el("p", "", LESSONS.length ? "No lessons found. Try another search or filter." : "No lessons yet. Add lessons in lessons.js"));
      lib.appendChild(e);
      return;
    }
    list.forEach((l, i) => lib.appendChild(makeCard(l, i, 0, false)));
  }

  /* ---------------- search ---------------- */
  $("search").addEventListener("input", (e) => { query = e.target.value.trim().toLowerCase(); render(); });
  $("clr").addEventListener("click", () => { $("search").value = ""; query = ""; render(); });

  /* ---------------- lesson page ---------------- */
  let current = null;
  let tick = null;
  const listView = $("app"), lessonView = $("lessonView"), lessonBody = $("lessonBody");

  function openLesson(l) {
    current = l;
    listView.classList.add("hidden");
    lessonView.classList.remove("hidden");
    tg.BackButton.show();
    window.scrollTo(0, 0);
    renderLesson();
  }
  function showList() {
    clearInterval(tick);
    if (current && UNLOCK_MINUTES === 0) delete unlockedUntil[current.id];
    current = null;
    lessonBody.innerHTML = "";
    lessonView.classList.add("hidden");
    listView.classList.remove("hidden");
    tg.BackButton.hide();
    render();
  }
  tg.BackButton.onClick(showList);
  $("backBtn").addEventListener("click", showList);

  function metaRow(l) {
    const r = el("div", "metarow");
    if (l.category) r.appendChild(el("span", "meta", "🏷 " + l.category));
    if (l.duration) r.appendChild(el("span", "meta", "⏱ " + l.duration));
    if (statsOn()) {
      r.appendChild(el("span", "meta", "👁 " + fmt(getStat(l.id, "views")) + " views"));
      r.appendChild(el("span", "meta", "❤️ " + fmt(getStat(l.id, "likes")) + " likes"));
    }
    return r;
  }

  function renderLesson() {
    clearInterval(tick);
    const l = current;
    lessonBody.innerHTML = "";
    lessonBody.appendChild(el("div", "ltitle", l.title));
    const row = metaRow(l);
    lessonBody.appendChild(row);
    if (isOpen(l.id)) {
      if (UNLOCK_MINUTES > 0) startTimer(l, row);
      showVideo(l);
    } else {
      showLockBox(l);
    }
  }

  // Countdown pill. When time is over, the lesson locks again.
  function startTimer(l, row) {
    const pill = el("span", "meta timer", "");
    row.insertBefore(pill, row.firstChild);
    const update = () => {
      if (!current || current.id !== l.id) { clearInterval(tick); return; }
      const left = unlockedUntil[l.id] - Date.now();
      if (left <= 0) {
        clearInterval(tick);
        toast("Time is up. Watch an ad to continue.");
        renderLesson();
        return;
      }
      pill.textContent = "⏳ " + mmss(left) + " left";
      pill.classList.toggle("low", left < 30000);
    };
    update();
    tick = setInterval(update, 1000);
  }

  function showLockBox(l) {
    const need = l.ads || DEFAULT_ADS;
    const box = el("div", "lockbox");
    const th = thumbEl(l);
    th.appendChild(el("span", "big", "🔒"));
    box.appendChild(th);

    const inn = el("div", "lockin");
    inn.appendChild(el("h4", "", "This lesson is locked"));
    const how = UNLOCK_MINUTES > 0
      ? "Watch " + need + (need === 1 ? " short ad" : " short ads") + " to unlock it for " + UNLOCK_MINUTES + " minutes."
      : "Watch " + need + (need === 1 ? " short ad" : " short ads") + " to unlock it.";
    inn.appendChild(el("p", "", how));
    const dots = el("div", "dots");
    const dotEls = [];
    for (let i = 0; i < need; i++) { const d = el("div", "dot"); dots.appendChild(d); dotEls.push(d); }
    inn.appendChild(dots);
    const btn = el("button", "btn", "▶ Watch Ad to Unlock");
    inn.appendChild(btn);
    box.appendChild(inn);
    lessonBody.appendChild(box);
    lessonBody.appendChild(el("p", "note", "Ads help keep this content free."));

    btn.addEventListener("click", () => watchAds(l, need, btn, dotEls));
  }

  let adBusy = false;
  async function watchAds(l, need, btn, dotEls) {
    if (adBusy) return;
    if (!AdController) { toast("Ads are not ready. Please try again later."); return; }
    adBusy = true;
    btn.disabled = true;
    haptic("medium");
    try {
      for (let i = 0; i < need; i++) {
        btn.textContent = "Loading ad " + (i + 1) + " of " + need + "...";
        await AdController.show();
        dotEls[i].classList.add("on");
      }
      unlockedUntil[l.id] = Date.now() + (UNLOCK_MINUTES > 0 ? UNLOCK_MINUTES * 60000 : 24 * 3600000);
      hapticOk();
      toast("Lesson unlocked 🎉");
      adBusy = false;
      if (current && current.id === l.id) renderLesson();
      return;
    } catch (e) {
      toast("Ad not completed or no ad available right now. Please try again.");
      btn.disabled = false;
      btn.textContent = "▶ Watch Ad to Unlock";
    }
    adBusy = false;
  }

  /* ---------------- video ---------------- */
  function getVideoInfo(url) {
    let m;
    m = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
    if (!m) m = url.match(/drive\.google\.com\/(?:open|uc)\?(?:.*&)?id=([\w-]+)/);
    if (m) return { type: "iframe", src: "https://drive.google.com/file/d/" + m[1] + "/preview" };

    m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);
    if (m) return { type: "iframe", src: "https://www.youtube-nocookie.com/embed/" + m[1] };

    m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if (m) return { type: "iframe", src: "https://player.vimeo.com/video/" + m[1] };

    m = url.match(/dailymotion\.com\/video\/([\w]+)/);
    if (m) return { type: "iframe", src: "https://www.dailymotion.com/embed/video/" + m[1] };

    if (/^https?:\/\/t\.me\//.test(url)) return { type: "telegram", src: url };
    if (/\.(mp4|webm|ogg)(\?.*)?$/i.test(url)) return { type: "file", src: url };
    return { type: "link", src: url };
  }

  function showVideo(l) {
    if (!viewed.includes(l.id)) {
      viewed.push(l.id);
      saveList("viewed", viewed);
      bump(l.id, "views");
    }

    const info = getVideoInfo(l.url);
    if (info.type === "iframe") {
      const p = el("div", "player");
      const f = document.createElement("iframe");
      f.src = info.src;
      f.setAttribute("allow", "autoplay; fullscreen");
      f.setAttribute("allowfullscreen", "");
      p.appendChild(f);
      lessonBody.appendChild(p);
    } else if (info.type === "file") {
      const p = el("div", "player");
      const v = document.createElement("video");
      v.controls = true;
      v.setAttribute("playsinline", "");
      v.src = info.src;
      p.appendChild(v);
      lessonBody.appendChild(p);
    } else {
      const b = el("button", "btn", info.type === "telegram" ? "▶ Watch on Telegram" : "▶ Watch Video");
      b.addEventListener("click", () => {
        if (info.type === "telegram") tg.openTelegramLink(info.src);
        else tg.openLink(info.src);
      });
      lessonBody.appendChild(b);
    }

    if (info.type === "iframe") lessonBody.appendChild(el("p", "note", "If the video does not play, wait a moment and reopen the lesson."));
    if (l.desc) lessonBody.appendChild(el("p", "desc", l.desc));

    const row = el("div", "btnrow");
    if (statsOn()) {
      const already = liked.includes(l.id);
      const lb = el("button", "btn ghost" + (already ? " liked" : ""),
        (already ? "💖 Liked" : "🤍 Like") + " · " + fmt(getStat(l.id, "likes")));
      lb.disabled = already;
      lb.addEventListener("click", () => {
        if (liked.includes(l.id)) return;
        liked.push(l.id);
        saveList("liked", liked);
        bump(l.id, "likes");
        lb.className = "btn ghost liked";
        lb.textContent = "💖 Liked · " + fmt(getStat(l.id, "likes"));
        lb.disabled = true;
        hapticOk();
      });
      row.appendChild(lb);
    }
    const sb = el("button", "btn ghost", "↗ Share");
    sb.addEventListener("click", () => {
      haptic();
      const u = "https://t.me/share/url?url=" + encodeURIComponent(APP_LINK) +
                "&text=" + encodeURIComponent("Check out: " + l.title);
      tg.openTelegramLink(u);
    });
    row.appendChild(sb);
    lessonBody.appendChild(row);

    // Up next
    const idx = LESSONS.findIndex((x) => x.id === l.id);
    const nx = idx >= 0 && idx < LESSONS.length - 1 ? LESSONS[idx + 1] : null;
    if (nx) {
      const n = el("div", "next");
      n.appendChild(el("div", "nico", nx.icon || "🎓"));
      const tx = el("div", "");
      tx.appendChild(el("small", "", "Up next"));
      tx.appendChild(el("b", "", nx.title));
      n.appendChild(tx);
      n.appendChild(el("div", "arrow", "›"));
      n.addEventListener("click", () => { haptic(); openLesson(nx); });
      lessonBody.appendChild(n);
    }
  }

  /* ---------------- start ---------------- */
  const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (user && user.first_name) {
    $("hello").textContent = "Hey, " + user.first_name + " 👋";
    $("avatar").textContent = user.first_name.charAt(0).toUpperCase();
  }
  render();
  initFirebase().then(() => { loading = false; render(); });
</script>
</body>
</html>
